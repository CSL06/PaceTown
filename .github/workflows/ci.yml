name: CI

# Every push to main and every PR into it. Nothing merges that has not passed
# the same four checks a developer runs locally with `npm run check`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json.
          node-version: '24'
          cache: npm

      # `ci` rather than `install`: it honours the lockfile exactly and fails
      # if package.json and the lockfile have drifted apart.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # A CSS custom property that is never defined does not throw, log, or
      # fail a build -- it just silently deletes the declaration that used it.
      # Three separate instances of that shipped before this check existed.
      - name: Check CSS tokens
        run: npm run check:tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Last, because a build failure after green tests is almost always a
      # config problem rather than a code one, and that is worth seeing apart.
      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Kept separate from `check` so a browser download never delays the fast
    # lint/typecheck/unit feedback.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # The config builds and serves the production bundle itself.
      - name: Run journeys
        run: npm run test:e2e -- --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
