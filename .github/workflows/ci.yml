name: CI

# Every push to main and every PR into it. Nothing merges that has not passed
# the same four checks a developer runs locally with `npm run check`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json.
          node-version: '20.19'
          cache: npm

      # `ci` rather than `install`: it honours the lockfile exactly and fails
      # if package.json and the lockfile have drifted apart.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Last, because a build failure after green tests is almost always a
      # config problem rather than a code one, and that is worth seeing apart.
      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
